<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 250" width="1000" height="250" role="img" aria-label="AI 开发工作流：七个阶段">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#9aa8b8"/>
    </marker>
    <style>
      .box{fill:#ffffff;stroke:#dde4ec;stroke-width:1.2;rx:10}
      .num{font:700 11px ui-monospace,Consolas,monospace;fill:#0d7d72}
      .ttl{font:600 13.5px -apple-system,"PingFang SC","Microsoft YaHei",sans-serif;fill:#0f172a}
      .sub{font:400 11px -apple-system,"PingFang SC","Microsoft YaHei",sans-serif;fill:#7a8797}
      .gate{font:600 11px -apple-system,"PingFang SC","Microsoft YaHei",sans-serif;fill:#b45309}
      .lbl{font:600 11px -apple-system,"PingFang SC","Microsoft YaHei",sans-serif;fill:#5b6b7f}
    </style>
  </defs>

  <rect width="1000" height="250" fill="#ffffff"/>

  <!-- 三个阶段分组 -->
  <text class="lbl" x="12" y="24">想清楚（只做一次）</text>
  <line x1="12" y1="32" x2="330" y2="32" stroke="#e3e8ef" stroke-width="1"/>
  <text class="lbl" x="352" y="24">写下来（只做一次）</text>
  <line x1="352" y1="32" x2="520" y2="32" stroke="#e3e8ef" stroke-width="1"/>
  <text class="lbl" x="542" y="24">做出来（按增量循环）</text>
  <line x1="542" y1="32" x2="988" y2="32" stroke="#e3e8ef" stroke-width="1"/>

  <!-- 阶段 0 -->
  <g>
    <rect class="box" x="12" y="58" width="132" height="86"/>
    <text class="num" x="24" y="80">阶段 0</text>
    <text class="ttl" x="24" y="102">读项目</text>
    <text class="sub" x="24" y="122">构建命令 · 目录 · 约定</text>
  </g>
  <!-- 阶段 1 -->
  <g>
    <rect class="box" x="168" y="58" width="132" height="86"/>
    <text class="num" x="180" y="80">阶段 1</text>
    <text class="ttl" x="180" y="102">澄清</text>
    <text class="sub" x="180" y="122">一次一问，自带建议</text>
  </g>
  <!-- 阶段 2 -->
  <g>
    <rect class="box" x="324" y="58" width="132" height="86"/>
    <text class="num" x="336" y="80">阶段 2</text>
    <text class="ttl" x="336" y="102">方案 + 对抗审查</text>
    <text class="sub" x="336" y="122">换视角挑错</text>
    <text class="gate" x="336" y="166">确认点 1</text>
    <line x1="390" y1="144" x2="390" y2="156" stroke="#e6b877" stroke-width="1.2"/>
  </g>
  <!-- 阶段 3 -->
  <g>
    <rect class="box" x="480" y="58" width="132" height="86"/>
    <text class="num" x="492" y="80">阶段 3</text>
    <text class="ttl" x="492" y="102">写规格</text>
    <text class="sub" x="492" y="122">.ai/CONTEXT.md</text>
    <text class="gate" x="492" y="166">确认点 2</text>
    <line x1="546" y1="144" x2="546" y2="156" stroke="#e6b877" stroke-width="1.2"/>
  </g>
  <!-- 阶段 4 -->
  <g>
    <rect class="box" x="636" y="58" width="110" height="86"/>
    <text class="num" x="648" y="80">阶段 4</text>
    <text class="ttl" x="648" y="102">拆 tickets</text>
    <text class="sub" x="648" y="122">判据 · 依赖</text>
  </g>
  <!-- 阶段 5 -->
  <g>
    <rect class="box" x="770" y="58" width="110" height="86"/>
    <text class="num" x="782" y="80">阶段 5</text>
    <text class="ttl" x="782" y="102">逐张实现</text>
    <text class="sub" x="782" y="122">先判据，后代码</text>
  </g>
  <!-- 阶段 6 -->
  <g>
    <rect class="box" x="904" y="58" width="84" height="86"/>
    <text class="num" x="916" y="80">阶段 6</text>
    <text class="ttl" x="916" y="102">两路评审</text>
    <text class="sub" x="916" y="122">规范 · 规格</text>
  </g>

  <!-- 箭头 -->
  <g stroke="#9aa8b8" stroke-width="1.2" marker-end="url(#ar)" fill="none">
    <line x1="146" y1="101" x2="164" y2="101"/>
    <line x1="302" y1="101" x2="320" y2="101"/>
    <line x1="458" y1="101" x2="476" y2="101"/>
    <line x1="614" y1="101" x2="632" y2="101"/>
    <line x1="748" y1="101" x2="766" y2="101"/>
    <line x1="882" y1="101" x2="900" y2="101"/>
  </g>

  <!-- 循环回线：验收通过后取下一个增量 -->
  <path d="M946 152 L946 206 L691 206 L691 150" stroke="#c6d2df" stroke-width="1.2" fill="none" stroke-dasharray="4 4" marker-end="url(#ar)"/>
  <text class="sub" x="712" y="224">阶段 7 回归验收通过 → 回到阶段 4 取下一个增量</text>
</svg>
